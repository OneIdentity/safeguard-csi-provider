apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: safeguard-bundle
spec:
  provider: safeguard
  parameters:
    # Hostname of the Safeguard appliance.
    safeguardHost: safeguard.example.com

    # A2A registration application name.
    appName: my-application

    # Restrict to specific account names (comma-separated, case-insensitive).
    # Omit to include every account the registration exposes.
    accountNames: db-admin,svc-account

    # Bundle mode: write a single JSON file keyed by account name instead of
    # one file per account. Higher density (one file, one inotify watch) while
    # still keeping everything in tmpfs and nothing in etcd.
    outputFormat: bundle

    # Credential types to include for each account in the bundle.
    objectTypes: Password,PrivateKey,ApiKey

    # SSH private-key format for any PrivateKey retrieved. Key material is
    # normalized to LF for clean consumption in Linux pods.
    keyFormat: OpenSsh

    # File name for the bundle (must be a plain file name, no path separators).
    # Defaults to secrets.json.
    # bundleFile: secrets.json

    # Trust a privately issued appliance certificate by supplying its issuing
    # CA chain as a PEM bundle. When omitted, the host's system root CAs are
    # used.
    # safeguardCaBundle: |
    #   -----BEGIN CERTIFICATE-----
    #   ...appliance issuing CA...
    #   -----END CERTIFICATE-----
