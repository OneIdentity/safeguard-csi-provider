apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: safeguard
spec:
  provider: safeguard
  parameters:
    # Hostname of the Safeguard appliance.
    safeguardHost: safeguard.example.com

    # A2A registration application name. Only accounts belonging to this
    # registration are mounted. Omit to mount every account the client
    # certificate is registered to retrieve.
    appName: my-application

    # Credential type to retrieve for each account: Password (default),
    # PrivateKey, or ApiKey.
    objectType: Password

    # SSH private-key format, used only when objectType is PrivateKey:
    # OpenSsh (default), Ssh2, or Putty.
    # keyFormat: OpenSsh

    # Trust a privately issued appliance certificate by supplying its issuing
    # CA chain as a PEM bundle. When omitted, the host's system root CAs are
    # used.
    # safeguardCaBundle: |
    #   -----BEGIN CERTIFICATE-----
    #   ...appliance issuing CA...
    #   -----END CERTIFICATE-----

    # Disable appliance certificate verification. Intended for bootstrapping
    # only; never enable this in production.
    # insecureSkipVerify: "false"
