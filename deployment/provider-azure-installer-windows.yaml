apiVersion: v1
kind: ServiceAccount
metadata:
  name: safeguard-csi-provider
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: safeguard-csi-provider
  name: safeguard-csi-provider-windows
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: safeguard-csi-provider
  template:
    metadata:
      labels:
        app: safeguard-csi-provider
    spec:
      serviceAccountName: safeguard-csi-provider
      containers:
        - name: provider-safeguard-installer
          image: starlingdev.azurecr.io/oneidentity/secrets-store/provider-safeguard:v0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=unix://C:\\provider\\safeguard.sock
            - --healthz-port=8989
            - --healthz-path=/healthz
            - --healthz-timeout=5s
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8989
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 100m
              memory: 200Mi
          volumeMounts:
            - mountPath: "C:\\provider"
              name: providervol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      volumes:
        - name: providervol
          hostPath:
            path: "C:\\k\\secrets-store-csi-providers"
            type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/os: windows
