# Azure DevOps pipeline for safeguard-csi-provider.
#
# Pull requests run build/lint/test only. Merges to main/release-* and v* tags
# additionally build the multi-arch image and push it to ghcr.io; v* tags also
# cut a GitHub Release. Doc-only changes are excluded from triggering builds.

trigger:
  branches:
    include:
      - main
      - release-*
  tags:
    include:
      - v*
  paths:
    exclude:
      - '**/*.md'
      - LICENSE
      - docs/*
      - .github/CODEOWNERS

pr:
  branches:
    include:
      - main
      - release-*
  paths:
    exclude:
      - '**/*.md'
      - LICENSE
      - docs/*
      - .github/CODEOWNERS

variables:
  - template: pipeline-templates/global-variables.yml

jobs:
  - job: PRValidation
    displayName: 'PR validation (build, lint, test)'
    condition: eq(variables['Build.Reason'], 'PullRequest')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - template: pipeline-templates/go-ci-steps.yml

  - job: BuildAndPublish
    displayName: 'Build, test, and publish image'
    condition: ne(variables['Build.Reason'], 'PullRequest')
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - template: pipeline-templates/go-ci-steps.yml
      - template: pipeline-templates/publish-steps.yml
