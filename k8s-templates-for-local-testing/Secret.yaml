# Local-testing node-publish secret for the Safeguard CSI Provider.
#
# The provider authenticates to Safeguard's A2A service with a client
# certificate, so this secret must carry PEM-encoded certificate + key under the
# keys `clientCertificate` and `clientKey` (NOT an Azure-style clientid/secret).
#
# Prefer generating this with kubectl so you don't paste PEM by hand:
#
#   kubectl create secret generic secrets-store-creds \
#     --from-file=clientCertificate=clientCertificate.pem \
#     --from-file=clientKey=clientKey.pem
#   kubectl label secret secrets-store-creds secrets-store.csi.k8s.io/used=true
#
# Convert a PKCS#12 (.pfx/.p12) export first if needed:
#
#   openssl pkcs12 -in client.pfx -clcerts -nokeys -out clientCertificate.pem
#   openssl pkcs12 -in client.pfx -nocerts -nodes  -out clientKey.pem
#
# The manifest below uses stringData so you can paste PEM directly for testing.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-store-creds
  labels:
    secrets-store.csi.k8s.io/used: "true"
type: Opaque
stringData:
  clientCertificate: |
    -----BEGIN CERTIFICATE-----
    # replace with your A2A client certificate (leaf plus any intermediates)
    -----END CERTIFICATE-----
  clientKey: |
    -----BEGIN PRIVATE KEY-----
    # replace with the matching private key
    -----END PRIVATE KEY-----