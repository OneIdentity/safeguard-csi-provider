# Dependabot configuration for safeguard-csi-provider.
#
# Ecosystems covered:
#   * gomod           -- Go module dependencies. Two modules live in this
#                        repo: the main module at the root and the build
#                        tooling module under /tools.
#   * github-actions  -- workflow file dependencies (CodeQL, etc.).
#   * docker          -- base images referenced by the container build.
#
# Major-version bumps are excluded; they require human review and a
# separate planning cycle (semantic-import versioning for Go means a
# major bump changes the module import path).
#
# The main module intentionally pins `go 1.21` (see go.mod and the
# CodeQL workflow's setup-go version). Some dependencies now raise their
# own go directive above 1.21 in newer releases, which would force the
# toolchain -- and in one case a source change -- so they are pinned
# here until we deliberately move off Go 1.21:
#   * golang.org/x/crypto     -- v0.32+ require go >= 1.25
#   * google.golang.org/grpc  -- v1.65+ require go >= 1.22 (v1.83 -> 1.25)
#   * k8s.io/component-base   -- v0.30+ require newer Go, and the
#                                logs/json package dropped the JSONLogger
#                                variable used in cmd/main.go (needs a
#                                code change before it can be bumped).
#
# GitHub Private Vulnerability Disclosure (PVD) should be enabled in
# the repository's Security tab; that toggle is not file-driven.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      go-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Pinned to keep the module on Go 1.21 (see header comment).
      - dependency-name: "golang.org/x/crypto"
      - dependency-name: "google.golang.org/grpc"
      - dependency-name: "k8s.io/component-base"

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    groups:
      tools-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      docker-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
