name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build (linux)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/

      - name: Build (windows)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/
