# Publish steps: fetch the GitHub token, log in to ghcr.io, build the multi-arch
# image (linux/amd64, linux/arm64, windows/amd64 nanoserver) with the repo's
# existing Makefile machinery, push a single manifest list, and cut a GitHub
# Release on tag builds.
#
# The windows.Dockerfile is COPY-only (no RUN) and uses the servercore-cache
# trick, so buildx builds every platform — including windows/amd64 — on this
# single Linux agent. No separate Windows agent is required for this image.
parameters:
  keyVaultServiceConnection: 'SafeguardOpenSource'
  keyVaultName: 'SafeguardBuildSecrets'
  gitHubTokenSecret: 'GitHubPackagesToken'
  gitHubReleaseConnection: 'PangaeaBuild-GitHub'
  repositoryName: 'OneIdentity/safeguard-csi-provider'
  # Newer buildkit than the Makefile default, for reliable windows/amd64 export.
  buildkitVersion: 'v0.13.2'

steps:
- task: AzureKeyVault@2
  inputs:
    azureSubscription: '${{ parameters.keyVaultServiceConnection }}'
    KeyVaultName: '${{ parameters.keyVaultName }}'
    SecretsFilter: '${{ parameters.gitHubTokenSecret }}'
  displayName: 'Get GitHub token from Azure Key Vault'

# Derive the image version and whether to move :latest. Tag builds (refs/tags/vX.Y.Z)
# publish the bare version X.Y.Z and update :latest; every other build publishes a
# dev-suffixed tag and leaves :latest untouched.
- script: |
    set -euo pipefail
    BRANCH="$(Build.SourceBranch)"
    if [[ "$BRANCH" == refs/tags/* ]]; then
      TAG="${BRANCH#refs/tags/}"
      IMAGE_VERSION="${TAG#v}"
      PUSH_LATEST=true
    else
      IMAGE_VERSION="$(semanticVersion)-dev.$(Build.BuildId)"
      PUSH_LATEST=false
    fi
    echo "Resolved image version: $IMAGE_VERSION (pushLatest=$PUSH_LATEST)"
    echo "##vso[task.setvariable variable=imageVersion]$IMAGE_VERSION"
    echo "##vso[task.setvariable variable=pushLatest]$PUSH_LATEST"
  displayName: 'Compute image version'

- script: echo "$(${{ parameters.gitHubTokenSecret }})" | docker login ghcr.io -u OneIdentity --password-stdin
  displayName: 'Login to ghcr.io'

# Register QEMU emulators so buildx can build linux/arm64 on this amd64 agent.
- script: docker run --privileged --rm tonistiigi/binfmt --install all
  displayName: 'Set up QEMU/binfmt for cross-arch builds'

# Build every OS/arch image and push the annotated manifest list, reusing the
# Makefile's container-all + push-manifest targets against ghcr.io.
- script: |
    set -euo pipefail
    make container-all push-manifest \
      REGISTRY='$(imageRegistry)' \
      IMAGE_NAME='$(imageName)' \
      IMAGE_VERSION='$(imageVersion)' \
      OUTPUT_TYPE=registry \
      BUILDKIT_VERSION='${{ parameters.buildkitVersion }}'
  displayName: 'Build and push multi-arch image'

- script: |
    set -euo pipefail
    docker buildx imagetools create \
      --tag '$(imageRegistry)/$(imageName):latest' \
      '$(imageRegistry)/$(imageName):$(imageVersion)'
    docker buildx imagetools inspect '$(imageRegistry)/$(imageName):latest'
  displayName: 'Update :latest tag'
  condition: and(succeeded(), eq(variables['pushLatest'], 'true'))

- task: GitHubRelease@1
  inputs:
    gitHubConnection: '${{ parameters.gitHubReleaseConnection }}'
    repositoryName: '${{ parameters.repositoryName }}'
    action: 'create'
    target: '$(Build.SourceVersion)'
    tagSource: 'gitTag'
    title: '$(imageVersion)'
    isPreRelease: false
    changeLogCompareToRelease: 'lastFullRelease'
    changeLogType: 'commitBased'
  displayName: 'Create GitHub release'
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
