# Go build/lint/test steps, shared by the PR-validation job and used as the gate
# before publishing. Mirrors the safeguard-go CI pattern.
parameters:
  goVersion: '$(goVersion)'

steps:
- checkout: self
  clean: true

- task: GoTool@0
  displayName: 'Use Go ${{ parameters.goVersion }}'
  inputs:
    version: '${{ parameters.goVersion }}'

- script: |
    go version
    go env GOPATH GOMOD GOCACHE
  displayName: 'Show Go environment'

- script: go build ./...
  displayName: 'Build'

- script: |
    files=`gofmt -l .`
    if [ -n "$files" ]; then
      echo "gofmt required for:"
      echo "$files"
      exit 1
    fi
  displayName: 'Check gofmt'

- script: go vet ./...
  displayName: 'Vet'

- script: |
    set -euo pipefail
    # Build golangci-lint from the pinned tools module so it is compiled with this
    # job's Go toolchain. Prebuilt release binaries are built with an older Go and
    # refuse to analyze a module whose go directive is newer (this repo targets 1.25).
    cd tools
    go build -o /tmp/golangci-lint github.com/golangci/golangci-lint/cmd/golangci-lint
    cd ..
    /tmp/golangci-lint run --timeout=5m
  displayName: 'Lint with golangci-lint'

- script: go test -race ./...
  displayName: 'Run race-enabled unit tests'
